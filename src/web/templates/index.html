<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasonal | High-Precision Solar Engine</title>

    <!-- External Libraries -->
    <!-- Leaflet (Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
    
    <!-- Fonts (Inter for clean scientific look) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Internal CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- 1. The Map Layer -->
    <div id="map"></div>

    <!-- 2. The HUD (Heads-Up Display) Overlays -->
    
    <!-- Top Left: Location & Search -->
    <div class="hud-panel top-left">
        <div class="brand">
            <i class="fa-solid fa-sun fa-spin-pulse" style="--fa-animation-duration: 3s; color: #ffca28;"></i>
            <span>SEASONAL</span>
        </div>
        <div class="location-display">
            <h2 id="loc-name">Select a Location</h2>
            <div class="coords-row">
                <span id="loc-lat">--.----° N</span>
                <span id="loc-lon">--.----° E</span>
            </div>
        </div>
    </div>

    <!-- Top Right: Real-time Clock & Ephemeris -->
    <div class="hud-panel top-right">
        <div class="clock-widget">
            <div class="time-display" id="utc-clock">00:00:00 UTC</div>
            <div class="date-display" id="date-display">YYYY-MM-DD</div>
            
            <div class="ephemeris-grid">
                <div class="eph-item">
                    <span class="label">ALTITUDE</span>
                    <span class="value" id="val-alt">--.--°</span>
                </div>
                <div class="eph-item">
                    <span class="label">AZIMUTH</span>
                    <span class="value" id="val-az">--.--°</span>
                </div>
            </div>
        </div>
        <div class="controls">
            <!-- Calendar Picker -->
            <input type="date" id="date-picker" class="seasonal-input">
            <button id="btn-now" class="seasonal-btn" title="Reset to Now">
                <i class="fa-solid fa-clock-rotate-left"></i> Now
            </button>
        </div>
    </div>

    <!-- Bottom Center: 24h Daylight Bar -->
    <div class="hud-panel bottom-center">
        <div class="timeline-container">
            <div class="timeline-labels">
                <span>00:00</span>
                <span>06:00</span>
                <span>12:00</span>
                <span>18:00</span>
                <span>24:00</span>
            </div>
            
            <!-- The Visual Bar -->
            <div class="day-night-bar" id="day-bar">
                <!-- Segments will be injected by JS:
                     <div class="segment night" style="width: 25%"></div>
                     <div class="segment day" style="width: 50%"></div>
                     ...
                -->
                <div class="loading-bar">Calculating Solar Physics...</div>
            </div>

            <!-- Detailed Event Times -->
            <div class="event-times">
                <span id="txt-sunrise"><i class="fa-solid fa-sunrise"></i> --:--</span>
                <span id="txt-transit"><i class="fa-solid fa-circle"></i> --:--</span>
                <span id="txt-sunset"><i class="fa-solid fa-sunset"></i> --:--</span>
                <span id="txt-duration" class="highlight">--h --m</span>
            </div>
        </div>
    </div>

    <!-- 3. Analysis Modal (Hidden by default) -->
    <div id="analysis-modal" class="modal-backdrop hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-chart-line"></i> Solar Analysis</h3>
                <button id="btn-close-modal" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <p>Analyze solar elevation for <strong><span id="modal-loc-name">Location</span></strong>.</p>
                
                <div class="modal-controls">
                    <label>Range:</label>
                    <select id="analysis-range" class="seasonal-select">
                        <option value="30">1 Month</option>
                        <option value="90">3 Months</option>
                        <option value="365" selected>1 Year</option>
                    </select>
                    <button id="btn-run-analysis" class="seasonal-btn primary">Compute Physics</button>
                </div>

                <div id="analysis-plot" class="plot-container">
                    <!-- Plotly Graph goes here -->
                    <div class="placeholder-text">Select range and click Compute.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     
    <!-- Leaflet Terminator (Day/Night Overlay) - We might implement custom or use a plugin logic in JS -->
    <!-- We will implement the custom logic in map_controller.js using the subsolar point API -->

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <!-- App Logic -->
    <script src="/static/js/widgets.js"></script>
    <script src="/static/js/map_controller.js"></script>
    
    <script>
        // Bootstrapper
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Seasonal Web Interface Initializing...");
            // Initialize controllers (defined in the JS files)
            if(window.MapController) window.MapController.init();
            if(window.Widgets) window.Widgets.init();
        });
    </script>
</body>
</html>
