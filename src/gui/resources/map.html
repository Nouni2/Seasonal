<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasonal Map Engine</title>

    <!-- Leaflet CSS (Via Cloudflare) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; }
        #map { height: 100%; width: 100%; background: #242f3e; }
        
        /* Custom Popup Style */
        .seasonal-popup .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 30, 0.95);
            color: #eee;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px;
        }
        .seasonal-popup .leaflet-popup-tip {
            background: rgba(20, 20, 30, 0.95);
        }
        .seasonal-popup a.leaflet-popup-close-button {
            color: #aaa;
        }
        
        /* Analysis Button */
        .btn-analyze {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 6px 12px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            transition: background 0.2s;
        }
        .btn-analyze:hover { background: #0098ff; }

        /* Sun Icon Style */
        .sun-icon {
            font-size: 24px;
            line-height: 24px;
            text-align: center;
            text-shadow: 0 0 10px yellow;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- SCRIPTS -->
    <!-- 1. Leaflet Core (Via Cloudflare CDN - More Reliable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    
    <!-- 2. Leaflet Terminator (Day/Night Shader) -->
    <!-- We keep unpkg for this plugin as it is not on cdnjs, but we wrap usage in try/catch -->
    <script src="https://unpkg.com/@joergdietrich/leaflet.terminator"></script>

    <!-- 3. Qt WebChannel (The Bridge to Python) -->
    <script src="https://unpkg.com/qwebchannel@1.0.0/qwebchannel.js"></script>

    <script>
        // --- GLOBAL STATE ---
        var map;
        var terminator = null;
        var sunMarker;
        var pyBridge = null; // Reference to Python Backend
        var currentPin = null;

        // --- INITIALIZATION ---
        function initMap() {
            // Safety Check: Did Leaflet load?
            if (typeof L === 'undefined') {
                document.getElementById('map').innerHTML = '<h2 style="color:white; text-align:center; padding-top:20%;">Error: Could not load Leaflet JS.<br>Check Internet Connection.</h2>';
                return;
            }

            // Dark Map Style (CartoDB Dark Matter)
            map = L.map('map', {
                center: [20, 0],
                zoom: 2,
                minZoom: 2,
                maxZoom: 12,
                zoomControl: false, // We will add custom if needed
                attributionControl: false
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            // Add Day/Night Terminator (Initialize at current system time initially)
            // Safety check for the plugin
            if (L.terminator) {
                try {
                    terminator = L.terminator();
                    terminator.addTo(map);
                } catch(e) {
                    console.error("Terminator failed to init:", e);
                }
            } else {
                console.warn("Leaflet.Terminator plugin not loaded.");
            }

            // Add Sun Icon
            var SunIcon = L.divIcon({
                className: 'sun-icon',
                html: '☀️',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
            sunMarker = L.marker([0, 0], {icon: SunIcon, interactive: false}).addTo(map);

            setupBridge();
            setupInteractions();
        }

        // --- PYTHON BRIDGE SETUP ---
        function setupBridge() {
            if (typeof qt != 'undefined') {
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    // Connect to the Python Object named "pyBridge"
                    pyBridge = channel.objects.pyBridge;
                    console.log("Connected to Seasonal Python Engine.");
                });
            } else {
                console.warn("Qt WebChannel not found. Running in standalone mode.");
            }
        }

        // --- INTERACTIONS ---
        function setupInteractions() {
            map.on('click', function(e) {
                if (pyBridge) {
                    // Ask Python for data about this point
                    pyBridge.onMapClicked(e.latlng.lat, e.latlng.lng);
                } else {
                    // Fallback for testing without Python
                    showLocationPopup(e.latlng.lat, e.latlng.lng, "Python Disconnected", "N/A");
                }
            });
        }

        // --- API (CALLED BY PYTHON) ---

        /**
         * Updates the Terminator and Sun position based on Python calculation.
         * @param {string} isoDateStr - ISO format date string (UTC)
         * @param {float} subSolarLat - Latitude where sun is overhead
         * @param {float} subSolarLon - Longitude where sun is overhead
         */
        function updateSolarState(isoDateStr, subSolarLat, subSolarLon) {
            var t = new Date(isoDateStr);
            
            // Update Shadow
            if (terminator) {
                terminator.setTime(t);
            }

            // Update Sun Icon
            if (sunMarker) {
                sunMarker.setLatLng([subSolarLat, subSolarLon]);
            }
        }

        /**
         * Displays a popup with data calculated by Python.
         */
        function showLocationPopup(lat, lon, title, dataHtml) {
            // Remove old pin
            if (currentPin) map.removeLayer(currentPin);

            // Add new pin
            currentPin = L.circleMarker([lat, lon], {
                color: '#00aaff',
                radius: 6,
                fillOpacity: 1
            }).addTo(map);

            // Build Content
            var content = `
                <div style="min-width: 150px;">
                    <h3 style="margin: 0 0 5px 0; color: #00aaff;">${title}</h3>
                    <div style="margin-bottom: 8px; color: #ccc;">
                        ${dataHtml}
                    </div>
                    <button class="btn-analyze" onclick="requestDetailedPlot(${lat}, ${lon})">
                        Detailed Plot
                    </button>
                </div>
            `;

            // Bind and open popup
            currentPin.bindPopup(content, {
                className: 'seasonal-popup',
                closeButton: true
            }).openPopup();
        }

        /**
         * Bridge wrapper to call Python analysis
         */
        function requestDetailedPlot(lat, lon) {
            if (pyBridge) {
                pyBridge.requestAnalysis(lat, lon);
                map.closePopup();
            }
        }

        // Start
        initMap();

    </script>
</body>
</html>
